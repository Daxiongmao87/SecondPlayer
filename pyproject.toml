[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secondplayer"
version = "0.1.0"
description = "Local visual AI players for stock emulators"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "SecondPlayer contributors"}]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=5.3",
  "safetensors>=0.4",
  "huggingface_hub>=0.20",
  "laya @ git+https://github.com/r33drichards/laya-vision.git@404fc4a63208d14b544d5c852f81e88972d267bb",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
secondplayer = "secondplayer.cli:main"
secondplayerd = "secondplayer.cli:main"

[tool.setuptools.packages.find]
include = ["secondplayer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.package-data]
"secondplayer.adapters.mesence" = ["bridge.lua"]
